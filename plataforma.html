<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Plataforma</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#1a3a2a">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/shared.css">
    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="./css/admin-modulo3.css">
    <link rel="stylesheet" href="./css/admin-estoque.css">
    <link rel="stylesheet" href="./css/admin-icones.css">
    <link rel="stylesheet" href="./css/plataforma.css">
</head>
<body>
    <main id="plataforma" class="pf">
        <header class="pf-cab">
            <div class="pf-cab-titulo"><h1>Plataforma</h1><p id="pf-resumo" class="pf-resumo-linha"></p></div>
            <a class="pf-voltar" href="./admin.html">Painel da loja</a>
        </header>
        <nav class="pf-abas" id="pf-abas" role="tablist" aria-label="Partes da plataforma" hidden>
            <button type="button" role="tab" data-aba="feiras">Feiras</button>
            <button type="button" role="tab" data-aba="lojas">Lojas</button>
            <button type="button" role="tab" data-aba="condominios">Condomínios</button>
            <button type="button" role="tab" data-aba="mensalidades">Mensalidades</button>
            <button type="button" role="tab" data-aba="chaves">Chaves</button>
            <button type="button" role="tab" data-aba="erros">Erros</button>
        </nav>
        <div id="pf-conteudo" class="pf-conteudo" aria-live="polite"><p class="config-sub">Conferindo o seu acesso...</p></div>
    </main>
    <div class="modal-overlay pf-folha-fundo" id="pf-folha" role="dialog" aria-modal="true" aria-labelledby="pf-folha-titulo" aria-hidden="true">
        <div class="pf-folha">
            <header class="pf-folha-cab"><h2 id="pf-folha-titulo"></h2><button type="button" class="pf-fechar" data-pf="fechar-folha" aria-label="Fechar">&times;</button></header>
            <div class="pf-folha-corpo" id="pf-folha-corpo"></div>
            <footer class="pf-folha-pe" id="pf-folha-pe"></footer>
        </div>
    </div>
    <div class="toast" id="toast" role="alert"></div>
    <script type="module" src="./js/plataforma.js"></script>
</body>
</html>
