<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Admin - Banca Adair</title>
    <style>
        :root {
            --forest: #1a3a2a; --forest-mid: #2c5542; --sage: #8ba888;
            --foam: #e8f0e8; --earth: #c86b3e; --parchment: #e0d5c1;
            --warm-white: #faf7f2; --text-dark: #1c1c1c; --text-mid: #4a4a4a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, system-ui, sans-serif; }
        body { background-color: var(--warm-white); color: var(--text-dark); padding: 20px; }
        
        /* Cabeçalho */
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: var(--forest); color: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .admin-header h1 { font-size: 1.5rem; }
        
        /* Grid Kanban (Pedidos) */
        .kanban-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .kanban-col { background: white; border-radius: 12px; padding: 15px; border: 1px solid var(--parchment); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .kanban-col h2 { font-size: 1.2rem; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid var(--foam); display: flex; justify-content: space-between; }
        
        /* Cartão de Pedido */
        .pedido-card { background: var(--warm-white); border: 1px solid var(--sage); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .pedido-card h3 { font-size: 1.1rem; margin-bottom: 5px; color: var(--forest); }
        .pedido-card p { font-size: 0.9rem; color: var(--text-mid); margin-bottom: 5px; line-height: 1.4; }
        .pedido-card .tags { display: flex; gap: 8px; margin: 10px 0; }
        .tag { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .tag.alerta { background: var(--earth); color: white; }
        
        /* Botões */
        .btn { padding: 10px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; width: 100%; transition: 0.2s; }
        .btn-primary { background: var(--forest); color: white; }
        .btn-warning { background: var(--earth); color: white; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* Modais */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.aberto { display: flex; }
        .modal { background: white; border-radius: 16px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }
        .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 20px; border-bottom: 1px solid var(--parchment); }
        .btn-fechar { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-mid); }
        
        /* Toast (Notificações) */
        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--forest); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; transition: 0.3s; z-index: 9999; text-align: center; width: 90%; max-width: 400px; }
        #toast.show { bottom: 20px; }
        #toast.erro { background: var(--earth); }
    </style>
</head>
<body>

    <div class="admin-header">
        <h1>📦 Painel Admin - Banca Adair</h1>
        <div style="display:flex; gap: 10px;">
            <button class="btn" style="background:var(--foam); color:var(--forest); padding: 8px 15px;" onclick="window.location.href='/'">Ver Loja</button>
        </div>
    </div>

    <div class="kanban-board">
        <div class="kanban-col">
            <h2>Novos Pedidos <span id="count-novos">0</span></h2>
            <div id="coluna-novos"></div>
        </div>

        <div class="kanban-col">
            <h2>Em Preparação <span id="count-prep">0</span></h2>
            <div id="coluna-prep"></div>
        </div>

        <div class="kanban-col">
            <h2>Enviados Hoje <span id="count-env">0</span></h2>
            <div id="coluna-env"></div>
        </div>
    </div>

    <div id="toast">Notificação</div>

    <div class="modal-overlay" id="modal-picking">
        <div class="modal" style="text-align: center;">
            <div class="modal-head" style="background: var(--forest); color: white;">
                <h2 id="picking-title">Separação de Pedido</h2>
                <button class="btn-fechar" onclick="fecharModal('modal-picking')" style="color: white;">×</button>
            </div>
            
            <div class="modal-body" style="padding: 30px 20px;">
                
                <div id="picking-step-container">
                    <span id="picking-contador" style="background: var(--foam); color: var(--forest); padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; margin-bottom: 15px; display: inline-block;">Item 1 de X</span>
                    
                    <h3 id="picking-nome-produto" style="font-size: 1.8rem; margin-bottom: 5px; color: var(--text-dark);">Nome do Produto</h3>
                    <p id="picking-qtd-pedida" style="font-size: 1.2rem; color: var(--earth); font-weight: bold; margin-bottom: 25px;">Pedido: 5 unidades</p>
                    
                    <div style="background: var(--warm-white); border: 2px dashed var(--parchment); padding: 20px; border-radius: 12px; margin-bottom: 25px;">
                        <label style="display: block; font-weight: 600; margin-bottom: 10px; color: var(--text-mid);">Coloque na balança e digite o peso (Kg):</label>
                        <div style="display: flex; align-items: center; justify-content: center; gap: 10px;">
                            <input type="number" id="picking-input-peso" step="0.001" placeholder="Ex: 1.250" style="width: 150px; font-size: 1.5rem; text-align: center; padding: 15px; border: 2px solid var(--forest); border-radius: 8px;">
                            <span style="font-size: 1.5rem; font-weight: bold; color: var(--text-light);">kg</span>
                        </div>
                    </div>
                    
                    <button id="btn-picking-proximo" class="btn btn-primary" style="font-size: 1.2rem; padding: 18px;">Salvar Peso e Avançar ➔</button>
                </div>

                <div id="picking-resumo-container" style="display: none;">
                    <div style="font-size: 3rem; margin-bottom: 10px;">✅</div>
                    <h3 style="font-size: 1.5rem; color: var(--forest); margin-bottom: 15px;">Tudo Separado e Pesado!</h3>
                    
                    <div style="background: var(--foam); padding: 20px; border-radius: 12px; text-align: left; margin-bottom: 25px;">
                        <p style="margin-bottom: 8px; color: var(--text-mid);">Valor Original (S/ Pesagem): <span id="resumo-valor-antigo" style="float: right; text-decoration: line-through;">R$ 0,00</span></p>
                        <p style="font-size: 1.3rem; font-weight: 900; color: var(--text-dark); border-top: 1px solid var(--sage); padding-top: 8px; margin-top: 8px;">Novo Valor Exato: <span id="resumo-valor-novo" style="float: right; color: var(--forest);">R$ 0,00</span></p>
                    </div>

                    <button id="btn-picking-finalizar" class="btn btn-primary" style="font-size: 1.2rem; padding: 18px; background: #25D366; border-color: #25D366;">Concluir e Avisar Cliente 🚀</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/admin.js"></script>
</body>
</html>
