name: Diagnostico iPhone (temporario)
on: push
permissions:
  contents: write
jobs:
  testar:
    if: github.ref == 'refs/heads/diagnostico-iphone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Links da plaquinha NFC
        run: |
          exec > resultado.txt 2>&1
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          for u in https://usebanca.com/feira/madri http://usebanca.com/feira/madri https://www.usebanca.com/feira/madri http://www.usebanca.com/feira/madri https://usebanca.com/feira/madri/ "https://usebanca.com/?feira=madri&entrar=1" https://usebanca.com/feira/Madri https://usebanca.com/madri https://usebanca.com/feira.html; do
            echo "======== $u"
            curl -sS -L -o /tmp/b -A "$UA" -m 25 -w 'final=%{url_effective} http=%{http_code} redirs=%{num_redirects} ip=%{remote_ip}\n' "$u" 2>&1 | tail -3
            head -c 150 /tmp/b | tr '\n' ' '; echo
          done
          echo "======== www DNS"; dig +short @1.1.1.1 www.usebanca.com A; echo "(vazio = www não existe)"
      - name: Guardar resultado
        if: always()
        run: |
          git config user.name diagnostico; git config user.email diagnostico@users.noreply.github.com
          git add resultado.txt; git commit -m "resultado do diagnóstico [skip ci]" && git push
