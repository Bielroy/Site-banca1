name: Diagnostico iPhone (temporario)
on: push
permissions:
  contents: write
jobs:
  testar:
    if: github.ref == 'refs/heads/diagnostico-iphone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Teste do www
        run: |
          exec > resultado.txt 2>&1
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          echo "DNS www: $(dig +short @1.1.1.1 www.usebanca.com A | tr '\n' ' ')"
          for u in https://www.usebanca.com/feira/feira-madri "https://www.usebanca.com/feira/feira-madri?x=1" http://www.usebanca.com/feira/feira-madri https://www.usebanca.com/ https://usebanca.com/feira/feira-madri https://fotos.usebanca.com/ https://usebanca.com/api/saude; do
            echo "======== $u"
            curl -sS -o /tmp/b -D /tmp/h -A "$UA" -m 25 -w 'http=%{http_code} ip=%{remote_ip}\n' "$u" 2>&1 | tail -2
            grep -i '^location' /tmp/h
            curl -sS -L -o /dev/null -A "$UA" -m 25 -w 'final=%{url_effective} http=%{http_code} redirs=%{num_redirects}\n' "$u" 2>&1 | tail -1
          done
      - name: Guardar resultado
        if: always()
        run: |
          git config user.name diagnostico; git config user.email diagnostico@users.noreply.github.com
          git add resultado.txt; git commit -m "resultado do diagnóstico [skip ci]" && git push
