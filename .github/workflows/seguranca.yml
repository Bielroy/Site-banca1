# Roda a cada mudança enviada ao GitHub:
#   1. os testes do projeto (inclusive os de segurança), com o banco de mentira;
#   2. as REGRAS do banco e do armazenamento (firestore.rules / storage.rules) no
#      emulador oficial do Firebase, tentando ler e gravar o que não pode.
# Não usa nenhuma chave nem toca no site que está no ar.
name: Testes de segurança

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes do projeto (banco de mentira)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node testes/index.js

  build:
    name: Instalação travada e build do site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # npm ci instala EXATAMENTE as versões do package-lock.json (falha se ele e o package.json não baterem)
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  regras:
    name: Regras do banco no emulador do Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar o emulador e a biblioteca de teste (numa pasta à parte)
        run: npm install --prefix testes/regras --no-audit --no-fund
      - name: Rodar as regras no emulador
        # A saída vai para a tela e, se algo falhar, o resumo vira "anotações" do trabalho
        # (dá para ler sem baixar o registro inteiro).
        run: |
          set +e
          testes/regras/node_modules/.bin/firebase emulators:exec --only firestore,storage --project demo-banca "node testes/regras/regras.test.js" > saida.txt 2>&1
          codigo=$?
          cat saida.txt
          if [ "$codigo" -ne 0 ]; then
            grep -A7 "FALHOU" saida.txt | cut -c1-260 > falhas.txt
            [ -s falhas.txt ] || tail -45 saida.txt | cut -c1-260 > falhas.txt
            split -l 14 falhas.txt pedaco_
            n=0
            for p in pedaco_*; do
              n=$((n+1)); [ "$n" -gt 9 ] && break
              msg=$(sed 's/%/%25/g' "$p" | awk '{printf "%s%%0A", $0}')
              echo "::error title=Regras no emulador ($n)::$msg"
            done
          else
            echo "::notice title=Regras no emulador::$(grep 'testes das regras passaram' saida.txt | tail -1)"
          fi
          exit "$codigo"
