<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca Adair e Pedrina</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4332">
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --green-deep: #1b4332;
            --green-mid: #2d6a4f;
            --green-soft: #52b788;
            --green-pale: #d8f3dc;
            --orange: #f4845f;
            --orange-deep: #e05c2e;
            --cream: #fefae0;
            --sand: #f0ebe0;
            --danger: #e63946;
            --text: #1a1a2e;
            --text-muted: #6b7280;
            --white: #ffffff;
            --shadow: 0 4px 24px rgba(27,67,50,0.10);
            --shadow-lg: 0 12px 40px rgba(27,67,50,0.15);
            --radius: 18px;
            --radius-sm: 10px;
            --blue: #2563eb;
            --yellow: #f59e0b;
            --purple: #7c3aed;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Sans', sans-serif; background: var(--sand); color: var(--text); min-height: 100vh; }

        header { background: var(--green-deep); color: var(--white); padding: 2.5rem 2rem 2rem; text-align: center; position: relative; overflow: hidden; }
        header::before { content: ''; position: absolute; top: -60px; right: -60px; width: 220px; height: 220px; background: rgba(82,183,136,0.15); border-radius: 50%; }
        header::after { content: ''; position: absolute; bottom: -40px; left: -40px; width: 160px; height: 160px; background: rgba(244,132,95,0.1); border-radius: 50%; }
        header h1 { font-family: 'Playfair Display', serif; font-size: 2.6rem; font-weight: 900; letter-spacing: -0.5px; position: relative; z-index: 1; }
        header h1 span { color: var(--green-soft); }
        header p { font-size: 0.95rem; opacity: 0.75; margin-top: 6px; font-weight: 300; position: relative; z-index: 1; }
        .header-badges { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; position: relative; z-index: 1; }
        .badge { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; }

        .controles { background: var(--white); position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 20px rgba(0,0,0,0.07); padding: 14px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .busca-wrap { width: 100%; max-width: 560px; position: relative; }
        .busca-wrap svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 18px; height: 18px; pointer-events: none; }
        .busca-input { width: 100%; padding: 12px 18px 12px 44px; border-radius: 30px; border: 1.5px solid #e5e7eb; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; outline: none; transition: all 0.25s; background: var(--sand); }
        .busca-input:focus { border-color: var(--green-soft); background: white; box-shadow: 0 0 0 3px rgba(82,183,136,0.15); }
        .categorias { display: flex; gap: 8px; overflow-x: auto; width: 100%; justify-content: center; padding-bottom: 2px; }
        .cat-btn { flex-shrink: 0; padding: 7px 20px; border-radius: 20px; border: 1.5px solid #e5e7eb; background: white; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
        .cat-btn:hover { border-color: var(--green-soft); color: var(--green-mid); }
        .cat-btn.active { background: var(--green-mid); color: white; border-color: var(--green-mid); box-shadow: 0 4px 12px rgba(45,106,79,0.3); }

        .layout { display: flex; gap: 28px; max-width: 1260px; margin: 0 auto; padding: 28px 20px; align-items: flex-start; }

        .produtos-grid { flex: 2; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; align-content: start; }
        .produto-card { background: var(--white); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); transition: all 0.3s ease; border: 1.5px solid transparent; display: flex; flex-direction: column; animation: fadeUp 0.4s ease both; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .produto-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--green-pale); }
        .produto-img-wrap { width: 100%; aspect-ratio: 1; background: var(--green-pale); display: flex; align-items: center; justify-content: center; font-size: 4rem; position: relative; overflow: hidden; }
        .produto-img-wrap img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
        .produto-unidade-tag { position: absolute; top: 10px; left: 10px; background: var(--green-deep); color: white; font-size: 0.7rem; font-weight: 600; padding: 3px 10px; border-radius: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
        .produto-info { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
        .produto-nome { font-weight: 600; font-size: 0.97rem; line-height: 1.3; color: var(--text); }
        .produto-preco-row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
        .produto-preco { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--green-mid); }
        .btn-add { width: 38px; height: 38px; border-radius: 50%; border: none; background: var(--green-pale); color: var(--green-mid); font-size: 22px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s; line-height: 1; }
        .btn-add:hover:not(:disabled) { background: var(--green-mid); color: white; transform: scale(1.1) rotate(90deg); box-shadow: 0 4px 12px rgba(45,106,79,0.35); }
        .btn-add:active:not(:disabled) { transform: scale(0.9); }

        .sem-produto { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .sem-produto span { font-size: 3rem; display: block; margin-bottom: 12px; }

        /* Carrinho */
        .carrinho { flex: 0 0 340px; background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; position: sticky; top: 140px; max-height: calc(100vh - 160px); overflow: hidden; }
        .carrinho-topo { padding: 20px 22px 16px; border-bottom: 1px solid #f3f4f6; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .carrinho-topo h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--green-deep); }
        .btn-limpar { background: none; border: none; color: var(--danger); font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; opacity: 0.8; transition: opacity 0.2s; }
        .btn-limpar:hover { opacity: 1; }
        .carrinho-itens { overflow-y: auto; flex: 1; padding: 8px 0; }
        .carrinho-vazio { text-align: center; padding: 48px 20px; color: var(--text-muted); }
        .carrinho-vazio span { font-size: 2.5rem; display: block; margin-bottom: 10px; }
        .carrinho-item { display: flex; align-items: center; gap: 12px; padding: 12px 22px; border-bottom: 1px dashed #f3f4f6; transition: background 0.15s; animation: slideInRight 0.3s ease forwards; }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
        .carrinho-item:hover { background: #fafafa; }
        .item-emoji { font-size: 1.6rem; flex-shrink: 0; width: 38px; height: 38px; background: var(--green-pale); border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .item-emoji img { width: 100%; height: 100%; object-fit: cover; }
        .item-meio { flex: 1; min-width: 0; }
        .item-nome { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-unidade { font-size: 0.75rem; color: var(--text-muted); }
        .qtd-ctrl { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
        .btn-qtd { width: 24px; height: 24px; border-radius: 6px; border: 1.5px solid #e5e7eb; background: white; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--green-mid); transition: all 0.2s; line-height: 1; }
        .btn-qtd:hover { background: var(--green-pale); border-color: var(--green-soft); }
        .qtd-input { width: 44px; text-align: center; border: 1.5px solid #e5e7eb; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 700; color: var(--text); padding: 2px 4px; outline: none; transition: border-color 0.2s; }
        .qtd-input:focus { border-color: var(--green-soft); }
        .item-preco { font-weight: 700; font-size: 0.92rem; color: var(--green-mid); flex-shrink: 0; }
        .carrinho-rodape { padding: 18px 22px 22px; border-top: 1.5px solid #f3f4f6; flex-shrink: 0; }
        .total-linha { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
        .total-label { font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }
        .total-valor { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--green-deep); font-weight: 700; }
        .btn-finalizar { width: 100%; padding: 16px; background: linear-gradient(135deg, #25D366, #1aab55); color: white; border: none; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; letter-spacing: 0.3px; transition: all 0.3s; box-shadow: 0 6px 20px rgba(37,211,102,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-finalizar:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(37,211,102,0.4); }
        .pulse-btn { animation: pulse-shadow 2s infinite; }
        @keyframes pulse-shadow { 0% { box-shadow: 0 0 0 0 rgba(37,211,102, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(37,211,102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37,211,102, 0); } }
        .pulse-text { transition: color 0.3s; }
        .pulse-text.update { color: var(--danger); transform: scale(1.1); display: inline-block; }

        /* Clientes Salvos */
        .clientes-salvos { margin-bottom: 16px; }
        .clientes-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .cliente-chip { background: var(--green-pale); border: 1px solid var(--green-soft); color: var(--green-deep); border-radius: 20px; padding: 5px 14px; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .cliente-chip:hover { background: var(--green-mid); color: white; }

        /* Status de Entrega */
        .status-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }
        .status-recebido { background: #fef3c7; color: #92400e; }
        .status-separando { background: #dbeafe; color: #1e40af; }
        .status-saiu { background: #ede9fe; color: #5b21b6; }
        .status-entregue { background: #d1fae5; color: #065f46; }
        .status-presencial { background: #fce7f3; color: #9d174d; }

        /* Painel de Entregas */
        .painel-entregas { margin-bottom: 20px; }
        .entrega-card { background: white; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; border: 1.5px solid #e5e7eb; transition: all 0.2s; }
        .entrega-card:hover { border-color: var(--green-soft); box-shadow: var(--shadow); }
        .entrega-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .entrega-cliente { font-weight: 700; font-size: 0.92rem; }
        .entrega-end { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
        .entrega-itens { font-size: 0.78rem; color: #555; margin: 6px 0; padding: 6px 10px; background: var(--sand); border-radius: 8px; }
        .entrega-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
        .entrega-total { font-weight: 700; color: var(--green-mid); font-size: 0.9rem; }
        .btn-status { padding: 6px 14px; border-radius: 20px; border: 1.5px solid #e5e7eb; background: white; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 700; cursor: pointer; transition: all 0.2s; color: var(--green-mid); }
        .btn-status:hover { background: var(--green-mid); color: white; border-color: var(--green-mid); }
        .btn-status-danger { color: var(--danger); }
        .btn-status-danger:hover { background: var(--danger); color: white; border-color: var(--danger); }

        /* Relatórios */
        .relatorio-card { background: var(--sand); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .relatorio-titulo { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #e5e7eb; }
        .stat-row:last-child { border-bottom: none; }
        .stat-nome { font-size: 0.88rem; font-weight: 600; }
        .stat-val { font-size: 0.88rem; color: var(--green-mid); font-weight: 700; }
        .stat-bar { height: 6px; background: var(--green-pale); border-radius: 4px; margin-top: 4px; overflow: hidden; }
        .stat-fill { height: 100%; background: var(--green-mid); border-radius: 4px; transition: width 0.5s ease; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-box { background: white; border-radius: 12px; padding: 14px; text-align: center; border: 1.5px solid #e5e7eb; }
        .stat-box-val { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--green-deep); font-weight: 700; }
        .stat-box-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

        /* Mobile */
        .flying-item { position: fixed; z-index: 1000; width: 40px; height: 40px; border-radius: 50%; background: var(--green-pale); display: flex; align-items: center; justify-content: center; font-size: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: none; }
        .btn-flutuante-carrinho { display: none; }
        .carrinho-overlay { display: none; }
        .btn-fechar-mobile { display: none; background: none; border: none; font-size: 24px; color: var(--text-muted); cursor: pointer; padding: 0 8px; line-height: 1; }

        @media (max-width: 860px) {
            .layout { flex-direction: column; padding: 16px; padding-bottom: 80px; }
            .produtos-grid { grid-template-columns: repeat(2, 1fr); }
            .btn-flutuante-carrinho { display: block; position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%); background: var(--green-deep); color: white; border: none; padding: 14px 28px; border-radius: 30px; font-weight: 700; font-size: 1rem; box-shadow: var(--shadow-lg); z-index: 100; transition: transform 0.2s; white-space: nowrap; }
            .btn-flutuante-carrinho:active { transform: translateX(-50%) scale(0.95); }
            .carrinho-overlay.aberto { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; backdrop-filter: blur(2px); }
            .carrinho { position: fixed; bottom: -100%; left: 0; width: 100%; max-height: 85vh; z-index: 1001; border-radius: 24px 24px 0 0; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); flex: none; top: auto; }
            .carrinho.aberto { bottom: 0; }
            .btn-fechar-mobile { display: block; }
        }
        @media (max-width: 420px) { .produtos-grid { grid-template-columns: 1fr 1fr; gap: 12px; } }

        footer { text-align: center; padding: 28px 20px 80px; color: var(--text-muted); font-size: 0.85rem; }
        .btn-admin-acesso { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; background: none; border: 1.5px solid #e5e7eb; color: var(--text-muted); font-family: 'DM Sans', sans-serif; font-size: 0.82rem; padding: 8px 18px; border-radius: 20px; cursor: pointer; transition: all 0.2s; }
        .btn-admin-acesso:hover { border-color: var(--green-soft); color: var(--green-mid); background: var(--green-pale); }

        /* Modais */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 500; justify-content: center; align-items: center; backdrop-filter: blur(6px); padding: 16px; }
        .modal-overlay.aberto { display: flex; }
        .modal { background: white; border-radius: var(--radius); width: 100%; max-width: 520px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: modalIn 0.3s ease; }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.95) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid #f3f4f6; flex-shrink: 0; }
        .modal-head h2 { font-family: 'Playfair Display', serif; color: var(--green-deep); font-size: 1.3rem; }
        .btn-fechar { background: none; border: none; font-size: 26px; cursor: pointer; color: var(--text-muted); line-height: 1; transition: color 0.2s; }
        .btn-fechar:hover { color: var(--danger); }
        .modal-body { overflow-y: auto; flex: 1; padding: 24px; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #e5e7eb; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 0.95rem; color: var(--text); outline: none; transition: border-color 0.2s; background: var(--sand); }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--green-soft); background: white; }
        #troco-group { display: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

        /* Admin */
        .modal.admin-modal { max-width: 680px; }
        .admin-tabs { display: flex; border-bottom: 1px solid #f3f4f6; flex-shrink: 0; overflow-x: auto; }
        .admin-tab { flex-shrink: 0; padding: 13px 16px; background: none; border: none; font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.82rem; color: var(--text-muted); cursor: pointer; border-bottom: 2.5px solid transparent; transition: all 0.2s; white-space: nowrap; }
        .admin-tab.active { color: var(--green-mid); border-bottom-color: var(--green-mid); }
        .secao-titulo { font-weight: 700; font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 12px; }
        .carousel { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; scroll-snap-type: x mandatory; }
        
        .admin-card { min-width: 260px; max-width: 260px; background: var(--sand); border-radius: 14px; padding: 24px 16px; scroll-snap-align: start; flex-shrink: 0; border: 1.5px solid #e5e7eb; text-align: center; position: relative; }
        .admin-card-img { width: 90px; height: 90px; border-radius: 12px; background: white; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; margin: 10px auto 16px; overflow: hidden; border: 1px solid #f0f0f0; }
        .admin-card-img img { width: 100%; height: 100%; object-fit: cover; }
        .admin-card h4 { font-size: 1.05rem; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
        
        .btn-edit-card { position: absolute; top: 12px; right: 12px; width: 42px; height: 42px; background: white; border: 1.5px solid #e5e7eb; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: all 0.2s; }
        .btn-edit-card:active { transform: scale(0.9); }
        
        .btn-quick-toggle { position: absolute; top: 12px; left: 12px; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: all 0.2s; }
        .btn-quick-toggle:active { transform: scale(0.9); }
        .btn-quick-toggle.desativar { background: #fee2e2; color: #dc2626; border: 1.5px solid #fca5a5; }
        .btn-quick-toggle.ativar { background: #d1fae5; color: #059669; border: 1.5px solid #6ee7b7; }

        .editor-section { background: var(--sand); border-radius: 14px; padding: 20px; margin-bottom: 16px; }
        .foto-upload-area { border: 2px dashed #d1d5db; border-radius: 12px; padding: 24px 16px; text-align: center; cursor: pointer; position: relative; background: white; }
        .foto-upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
        .foto-preview { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; display: none; margin: 0 auto 10px; border: 2px solid var(--green-pale); }
        .botoes-editor { display: flex; gap: 10px; margin-top: 20px; }
        .btn-primary { flex: 1; padding: 13px; background: var(--green-mid); color: white; border: none; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; }
        .btn-secondary { padding: 13px 20px; background: #f3f4f6; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: 'DM Sans', sans-serif; }
        .btn-danger { padding: 13px 20px; background: #fef2f2; color: var(--danger); border: 1.5px solid #fca5a5; border-radius: var(--radius-sm); cursor: pointer; font-family: 'DM Sans', sans-serif; }
        .btn-add-novo { width: 100%; padding: 14px; background: var(--green-pale); color: var(--green-deep); border: 2px dashed var(--green-soft); border-radius: 14px; font-weight: 700; cursor: pointer; margin-bottom: 20px; font-family: 'DM Sans', sans-serif; }
        .config-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #f3f4f6; }
        .config-input-inline { padding: 8px 12px; border: 1.5px solid #e5e7eb; border-radius: 8px; width: 200px; font-family: 'DM Sans', sans-serif; }
        .historico-item { background: var(--sand); border-radius: 12px; padding: 14px; margin-bottom: 10px; }

        .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--green-deep); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; z-index: 9999; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .toast.visivel { transform: translateX(-50%) translateY(0); }

        *:focus { outline: none; }
        *:focus-visible { outline: 3px solid var(--orange-deep); outline-offset: 2px; border-radius: 4px; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
    </style>
</head>
<body>

<header>

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13.5 19.79 19.79 0 0 1 1.61 4.9 2 2 0 0 1 3.59 2.73h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 10.13a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                Finalizar no WhatsApp
            </button>
        </div>
    </div>
</div>

<footer>
    &copy; 2026 Banca Adair e Pedrina. Todos os direitos reservados.<br>
    <button class="btn-admin-acesso" onclick="abrirAdmin()">🔒 Gerenciar Banca</button>

<div class="toast" id="toast"></div>

<!-- MODAL CHECKOUT -->

                    Enviar Pedido

            <button class="admin-tab" onclick="mudarAba('entregas')">🚚 Entregas</button>
            <button class="admin-tab" onclick="mudarAba('historico')">📋 Histórico</button>
            <button class="admin-tab" onclick="mudarAba('relatorios')">📊 Relatório</button>

<script>
const VERSAO = 'v16';
const SENHA_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4'; // "1234"

// Usamos estoque 999 para "Em Estoque" e 0 para "Esgotado"
const PADRAO = [
    { id: 1, nome: "Batata Inglesa", preco: 6.50, cat: "verduras", estoque: 999, emoji: "🥔", unidade: "kg", foto: null },
    { id: 2, nome: "Batata Doce", preco: 5.50, cat: "verduras", estoque: 999, emoji: "🍠", unidade: "kg", foto: null },
    { id: 3, nome: "Mandioca Descascada", preco: 10.00, cat: "verduras", estoque: 999, emoji: "🪵", unidade: "kg", foto: null }
]; // Resumido aqui só por espaço, o script puxa os reais do Google

const STATUS_ENTREGA = ['recebido', 'separando', 'saiu', 'entregue'];
const STATUS_LABEL = { recebido: '📥 Recebido', separando: '📦 Separando', saiu: '🚴 Saiu', entregue: '✅ Entregue', presencial: '🏪 Presencial' };
const STATUS_CLASS = { recebido: 'status-recebido', separando: 'status-separando', saiu: 'status-saiu', entregue: 'status-entregue', presencial: 'status-presencial' };

function carregar() {
    if (localStorage.getItem('banca_versao') !== VERSAO) {
        localStorage.setItem('banca_produtos', JSON.stringify(PADRAO));
        localStorage.setItem('banca_versao', VERSAO);
    }
    return JSON.parse(localStorage.getItem('banca_produtos') || '[]');
}

let produtos = [];

// ============================================================
// CARREGAR TUDO DA NUVEM QUANDO O SITE ABRE
// ============================================================
async function carregarProdutosDoFirebase() {
    try {
        if (!window.db) { setTimeout(carregarProdutosDoFirebase, 500); return; }

        const querySnapshot = await window.getDocs(window.collection(window.db, "produtos"));
        const listaDaNuvem = [];
        
        querySnapshot.forEach((doc) => {
            listaDaNuvem.push({ id: parseInt(doc.id), ...doc.data() });
        });

        if (listaDaNuvem.length > 0) {
            produtos = listaDaNuvem; 
            renderLoja(); 
        } else {
            produtos = carregar();
        }
    } catch (e) {
        console.error("Erro ao ler nuvem:", e);
        produtos = carregar(); 
    }
}
carregarProdutosDoFirebase();

// NOVIDADE: Essa função busca o histórico, clientes e entregas do Firebase silenciosamente
async function sincronizarDadosDaNuvem() {
    if (!window.db) { setTimeout(sincronizarDadosDaNuvem, 500); return; }
    try {
        const querySnapshot = await window.getDocs(window.collection(window.db, "loja"));
        querySnapshot.forEach((doc) => {
            // Se ele achar dados salvos na nuvem, ele atualiza o celular na hora
            if (doc.id === "clientes" && doc.data().dados) localStorage.setItem('banca_clientes', JSON.stringify(doc.data().dados));
            if (doc.id === "entregas" && doc.data().dados) localStorage.setItem('banca_entregas', JSON.stringify(doc.data().dados));
            if (doc.id === "historico" && doc.data().dados) localStorage.setItem('banca_historico', JSON.stringify(doc.data().dados));
            if (doc.id === "config" && doc.data().whatsapp) localStorage.setItem('banca_whatsapp', doc.data().whatsapp);
        });
    } catch(e) { 
        console.log("Erro ao puxar histórico da nuvem:", e); 
    }
}
sincronizarDadosDaNuvem();

let carrinho = JSON.parse(localStorage.getItem('banca_carrinho') || '[]');
let catAtiva = 'todas';
let busca = '';
let abaAtiva = 'produtos';
let editandoId = null;
let fotoBase64 = null;
let timeoutBusca;

const CATEGORIAS = ['todas','frutas','verduras','folhas','temperos'];
const CAT_LABEL = { todas:'🏷️ Ver Todos', frutas:'🍎 Frutas', verduras:'🥦 Verduras', folhas:'🥬 Folhas', temperos:'🧄 Temperos' };
const UNIDADES = ['kg','g','maço','un','caixa','dúzia','litro'];

function debounce(func, delay) {
    return function() { clearTimeout(timeoutBusca); timeoutBusca = setTimeout(() => func.apply(this, arguments), delay); };
}
const filtrarBuscaDebounced = debounce(() => {
    busca = document.getElementById('busca-input').value.toLowerCase().trim();
    renderLoja();
}, 300);

function renderCategorias() {
    const div = document.getElementById('categorias');
    div.innerHTML = CATEGORIAS.map(c =>
        `<button class="cat-btn ${catAtiva===c?'active':''}" onclick="setCat('${c}')">${CAT_LABEL[c]}</button>`
    ).join('');
}
function setCat(cat) { catAtiva = cat; renderCategorias(); renderLoja(); }

function renderLoja() {
    const grid = document.getElementById('lista-produtos');
    let lista = produtos.filter(p => {
        const cat = catAtiva === 'todas' || p.cat === catAtiva;
        const txt = p.nome.toLowerCase().includes(busca);
        return cat && txt && p.estoque > 0; // Só mostra os Disponíveis
    });

    if (lista.length === 0) {
        grid.innerHTML = `<div class="sem-produto"><span>🔍</span>Nenhum produto encontrado.</div>`;
        return;
    }

    grid.innerHTML = lista.map((p, i) => {
        const imgHTML = p.foto ? `<img src="${p.foto}" alt="${p.nome}">` : p.emoji || '📦';

        return `
        <div class="produto-card" style="animation-delay:${i*0.04}s">
            <div class="produto-img-wrap">
                ${imgHTML}
                <span class="produto-unidade-tag">${p.unidade || 'un'}</span>
            </div>
            <div class="produto-info">
                <div class="produto-nome">${p.nome}</div>
                <div class="produto-preco-row">
                    <span class="produto-preco">R$ ${fmt(p.preco)}</span>
                    <button class="btn-add" onclick="adicionarComAnimacao(event, ${p.id}, '${p.emoji||'📦'}')">+</button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function adicionarComAnimacao(event, id, emoji) {
    const btn = event.target;
    const rect = btn.getBoundingClientRect();
    const flyer = document.createElement('div');
    flyer.className = 'flying-item';
    flyer.textContent = emoji;
    flyer.style.left = `${rect.left}px`;
    flyer.style.top = `${rect.top}px`;
    document.body.appendChild(flyer);
    const cartIcon = window.innerWidth <= 860 ? document.getElementById('btn-carrinho-mobile') : document.querySelector('.carrinho-topo h2');
    const cartRect = cartIcon.getBoundingClientRect();
    setTimeout(() => { flyer.style.left = `${cartRect.left + 20}px`; flyer.style.top = `${cartRect.top + 10}px`; flyer.style.opacity = '0.5'; flyer.style.transform = 'scale(0.5)'; }, 10);
    setTimeout(() => flyer.remove(), 600);
    addCarrinho(id);
}

function addCarrinho(id) {
    const p = produtos.find(x => x.id === id);
    const item = carrinho.find(x => x.id === id);
    if (item) { item.qtd++; }
    else { carrinho.push({ id: p.id, nome: p.nome, preco: p.preco, emoji: p.emoji, foto: p.foto, unidade: p.unidade, qtd: 1 }); }
    atualizarEstadoCarrinho();
    toast(`${p.emoji || '✅'} ${p.nome} adicionado!`);
}

function alterarQtd(id, delta) {
    const idx = carrinho.findIndex(x => x.id === id);
    if (idx === -1) return;
    const nova = carrinho[idx].qtd + delta;
    if (nova <= 0) { carrinho.splice(idx, 1); }
    else { carrinho[idx].qtd = nova; }
    atualizarEstadoCarrinho();
}

function setQtdDireta(id, valor) {
    const idx = carrinho.findIndex(x => x.id === id);
    if (idx === -1) return;
    let nova = parseFloat(String(valor).replace(',', '.'));
    if (isNaN(nova) || nova <= 0) { carrinho.splice(idx, 1); }
    else { carrinho[idx].qtd = nova; }
    atualizarEstadoCarrinho();
}

function limparCarrinho() {
    if (carrinho.length === 0) return;
    if (!confirm('Esvaziar o carrinho?')) return;
    carrinho = [];
    atualizarEstadoCarrinho();
}

function atualizarEstadoCarrinho() {
    localStorage.setItem('banca_carrinho', JSON.stringify(carrinho));
    const el = document.getElementById('total-val');
    el.classList.add('update');
    setTimeout(() => el.classList.remove('update'), 300);
    const totalItens = carrinho.reduce((acc, item) => acc + item.qtd, 0);
    document.getElementById('qtd-flutuante').textContent = totalItens;
    renderCarrinho();
    renderLoja();
}

function renderCarrinho() {
    const div = document.getElementById('carrinho-itens');
    const spanTotal = document.getElementById('total-val');
    let total = 0;
    if (carrinho.length === 0) {
        div.innerHTML = `<div class="carrinho-vazio"><span>🛒</span>Seu carrinho está vazio.</div>`;
        spanTotal.textContent = '0,00';
        return;
    }
    div.innerHTML = carrinho.map(item => {
        const sub = item.preco * item.qtd;
        total += sub;
        const imgEl = item.foto ? `<img src="${item.foto}" style="width:100%;height:100%;object-fit:cover;" alt="">` : item.emoji || '📦';
        return `
        <div class="carrinho-item">
            <div class="item-emoji">${imgEl}</div>
            <div class="item-meio">
                <div class="item-nome">${item.nome}</div>
                <div class="item-unidade">${item.unidade || 'un'}</div>
                <div class="qtd-ctrl">
                    <button class="btn-qtd" onclick="alterarQtd(${item.id},-1)">−</button>
                    <input class="qtd-input" type="text" inputmode="decimal" value="${String(item.qtd).replace('.', ',')}" onchange="setQtdDireta(${item.id}, this.value)" oninput="this.value=this.value.replace(/[^0-9.,]/g,'')">
                    <button class="btn-qtd" onclick="alterarQtd(${item.id},1)">+</button>
                </div>
            </div>
            <span class="item-preco">R$ ${fmt(sub)}</span>
        </div>`;
    }).join('');
    spanTotal.textContent = fmt(total);
}

function toggleCarrinhoMobile() {
    document.getElementById('carrinho').classList.toggle('aberto');
    document.getElementById('carrinho-overlay').classList.toggle('aberto');
}

// ============================================================
// CLIENTES SALVOS (COM BACKUP NA NUVEM)
// ============================================================
function getClientes() { return JSON.parse(localStorage.getItem('banca_clientes') || '[]'); }

function salvarClientes(arr) { 
    localStorage.setItem('banca_clientes', JSON.stringify(arr)); 
    // Copia pra nuvem
    if (window.db) window.setDoc(window.doc(window.db, "loja", "clientes"), { dados: arr }).catch(e=>console.log(e));
}

function salvarClienteTemp() {}

function salvarClienteParaProximo() {
    const nome = document.getElementById('cli-nome').value.trim();
    const tel = document.getElementById('cli-tel').value.trim();
    const quadra = document.getElementById('cli-quadra').value.trim();
    const lote = document.getElementById('cli-lote').value.trim();
    const ref = document.getElementById('cli-ref').value.trim();

    if (!nome || !quadra || !lote) { toast('⚠️ Preencha nome, quadra e lote!'); return; }

    const clientes = getClientes();
    const idx = clientes.findIndex(c => c.nome.toLowerCase() === nome.toLowerCase());
    const novoCliente = { nome, tel, quadra, lote, ref };

    if (idx >= 0) { clientes[idx] = novoCliente; }
    else { clientes.unshift(novoCliente); }

    salvarClientes(clientes.slice(0, 20));
    renderClientesSalvos();
    toast('✅ Cliente salvo na nuvem!');
}

function renderClientesSalvos() {
    const area = document.getElementById('clientes-salvos-area');
    if (!area) return;
    const clientes = getClientes();
    if (clientes.length === 0) { area.innerHTML = ''; return; }
    area.innerHTML = `
        <div style="font-size:0.8rem; font-weight:700; color:var(--text-muted); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px;">Clientes salvos</div>
        <div class="clientes-chips">
            ${clientes.slice(0, 8).map(c =>
                `<button class="cliente-chip" onclick="preencherCliente('${c.nome}')">${c.nome} — Q${c.quadra}/L${c.lote}</button>`
            ).join('')}
        </div>
        <div style="height:12px;"></div>
    `;
}

function preencherCliente(nome) {
    const clientes = getClientes();
    const c = clientes.find(x => x.nome === nome);
    if (!c) return;
    document.getElementById('cli-nome').value = c.nome;
    document.getElementById('cli-tel').value = c.tel || '';
    document.getElementById('cli-quadra').value = c.quadra;
    document.getElementById('cli-lote').value = c.lote;
    document.getElementById('cli-ref').value = c.ref || '';
    toast(`✅ ${c.nome} carregado!`);
}

// ============================================================
// CHECKOUT
// ============================================================
function abrirCheckout() {
    if (carrinho.length === 0) { toast('Adicione produtos primeiro! 🛒'); return; }
    document.getElementById('carrinho').classList.remove('aberto');
    document.getElementById('carrinho-overlay').classList.remove('aberto');
    renderClientesSalvos();
    abrirModal('overlay-checkout');
}

function checarTroco() {
    const v = document.getElementById('cli-pagamento').value;
    document.getElementById('troco-group').style.display = v === 'Dinheiro' ? 'block' : 'none';
}

function enviarWhatsApp() {
    const nome = document.getElementById('cli-nome').value.trim();
    const tel = document.getElementById('cli-tel').value.trim();
    const quadra = document.getElementById('cli-quadra').value.trim();
    const lote = document.getElementById('cli-lote').value.trim();
    const ref = document.getElementById('cli-ref').value.trim();
    const pag = document.getElementById('cli-pagamento').value;
    const troco = document.getElementById('cli-troco').value;
    const obs = document.getElementById('cli-obs').value.trim();

    if (!nome || !quadra || !lote) { toast('⚠️ Preencha nome, quadra e lote!'); return; }

    const num = (localStorage.getItem('banca_whatsapp') || '').replace(/\D/g,'');
    if (!num) { toast('⚠️ Número WhatsApp não configurado! Acesse Gerenciar > Config.'); return; }

    let total = 0;
    const endFormatado = `Quadra ${quadra}, Casa ${lote}${ref ? ` (${ref})` : ''}`;

    let msg = `*NOVO PEDIDO — ${localStorage.getItem('banca_nome') || 'Banca'}*\n\n`;
    msg += `👤 *Cliente:* ${nome}`;
    if (tel) msg += ` · 📱 ${tel}`;
    msg += `\n📍 *Endereço:* ${endFormatado}\n`;
    msg += `💳 *Pagamento:* ${pag}`;
    if (pag === 'Dinheiro' && troco) msg += ` (troco p/ R$ ${parseFloat(troco).toFixed(2)})`;
    msg += `\n\n*📦 ITENS:*\n`;

    carrinho.forEach(item => {
        const sub = item.preco * item.qtd;
        total += sub;
        msg += `• ${String(item.qtd).replace('.', ',')} ${item.unidade || 'un'} de ${item.nome} — R$ ${fmt(sub)}\n`;
    });

    msg += `\n*TOTAL: R$ ${fmt(total)}*`;
    if (obs) msg += `\n\n📝 *Obs:* ${obs}`;

    const pedido = { nome, tel, quadra, lote, ref, pag, total, itens: [...carrinho], obs, data: new Date().toLocaleString('pt-BR'), tipo: 'online' };
    salvarHistorico(pedido);
    adicionarEntrega(pedido);

    window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank');

    fecharModal('overlay-checkout');
    carrinho = [];
    atualizarEstadoCarrinho();
    limparFormCheckout();
    toast('✅ Pedido enviado!');
}

function limparFormCheckout() {
    ['cli-nome','cli-tel','cli-quadra','cli-lote','cli-ref','cli-troco','cli-obs'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
    });
}

function getEntregas() { return JSON.parse(localStorage.getItem('banca_entregas') || '[]'); }

function salvarEntregas(arr) { 
    localStorage.setItem('banca_entregas', JSON.stringify(arr)); 
    // Copia pra nuvem
    if (window.db) window.setDoc(window.doc(window.db, "loja", "entregas"), { dados: arr }).catch(e=>console.log(e));
}

function adicionarEntrega(pedido) {
    const entregas = getEntregas();
    const id = Date.now();
    entregas.unshift({ ...pedido, id, status: pedido.tipo === 'presencial' ? 'presencial' : 'recebido' });
    salvarEntregas(entregas.slice(0, 100));
}

function avancarStatus(id) {
    const entregas = getEntregas();
    const e = entregas.find(x => x.id === id);
    if (!e) return;
    const idx = STATUS_ENTREGA.indexOf(e.status);
    if (idx < STATUS_ENTREGA.length - 1) e.status = STATUS_ENTREGA[idx + 1];
    salvarEntregas(entregas);
    mudarAba('entregas');
}

function removerEntrega(id) {
    if (!confirm('Arquivar esta entrega?')) return;
    const entregas = getEntregas().filter(x => x.id !== id);
    salvarEntregas(entregas);
    mudarAba('entregas');
}

function renderAbaEntregas(body) {
    document.getElementById('admin-titulo').textContent = '🚚 Painel de Entregas';
    const entregas = getEntregas();
    const ativas = entregas.filter(e => e.status !== 'entregue');
    const entregues = entregas.filter(e => e.status === 'entregue');

    const renderCard = (e) => {
        const statusLabel = STATUS_LABEL[e.status] || e.status;
        const statusClass = STATUS_CLASS[e.status] || '';
        const prox = STATUS_ENTREGA[STATUS_ENTREGA.indexOf(e.status) + 1];
        const proxLabel = prox ? `→ ${STATUS_LABEL[prox].split(' ')[1]}` : null;
        const endStr = e.quadra ? `Quadra ${e.quadra}, Casa ${e.lote}${e.ref ? ` (${e.ref})` : ''}` : (e.end || '');
        return `
        <div class="entrega-card">
            <div class="entrega-header">
                <div>
                    <div class="entrega-cliente">👤 ${e.nome}</div>
                    <div class="entrega-end">📍 ${endStr}</div>
                    ${e.tel ? `<div class="entrega-end">📱 ${e.tel}</div>` : ''}
                    <div class="entrega-end">🕐 ${e.data}</div>
                </div>
                <span class="status-badge ${statusClass}">${statusLabel}</span>
            </div>
            <div class="entrega-itens">${e.itens.map(i => `${i.qtd}x ${i.nome}`).join(' · ')}</div>
            <div class="entrega-footer">
                <span class="entrega-total">R$ ${fmt(e.total)} · ${e.pag}</span>
                <div style="display:flex;gap:6px;">
                    ${proxLabel && e.status !== 'presencial' ? `<button class="btn-status" onclick="avancarStatus(${e.id})">${proxLabel}</button>` : ''}
                    <button class="btn-status btn-status-danger" onclick="removerEntrega(${e.id})">✓ OK</button>
                </div>
            </div>
        </div>`;
    };

    body.innerHTML = `
        <button class="btn-add-novo" onclick="abrirPedidoPresencial()">🏪 Registrar Venda Presencial</button>
        <div class="secao-titulo">🔄 Em andamento (${ativas.length})</div>

        ${entregues.length ? entregues.map(renderCard).join('') : '<p style="color:#999;padding:10px 0">Nenhuma ainda.</p>'}
    `;
}

function addItemPresencial() {
    const prodId = parseInt(document.getElementById('pres-prod').value);
    const qtd = parseFloat(document.getElementById('pres-qtd').value) || 1;
    const p = produtos.find(x => x.id === prodId);
    if (!p) return;

    const existe = window._presItens.findIndex(x => x.id === prodId);
    if (existe >= 0) { window._presItens[existe].qtd += qtd; }
    else { window._presItens.push({ id: p.id, nome: p.nome, preco: p.preco, emoji: p.emoji, unidade: p.unidade, qtd }); }

    renderListaPresencial();
    toast(`${p.emoji} ${p.nome} adicionado`);
}

function renderListaPresencial() {
    const div = document.getElementById('pres-lista');
    if (!div) return;
    if (!window._presItens || window._presItens.length === 0) {
        div.innerHTML = '<p style="color:#999;text-align:center;padding:10px">Nenhum item ainda.</p>';
        return;
    }
    let total = 0;
    div.innerHTML = window._presItens.map((item, i) => {
        const sub = item.preco * item.qtd;
        total += sub;
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #e5e7eb;">
            <span>${item.emoji} ${item.nome} × ${String(item.qtd).replace('.',',')} ${item.unidade}</span>
            <span style="font-weight:700;color:var(--green-mid)">R$ ${fmt(sub)} <button onclick="window._presItens.splice(${i},1);renderListaPresencial();" style="background:none;border:none;color:var(--danger);cursor:pointer;margin-left:6px;">✕</button></span>
        </div>`;
    }).join('') + `<div style="display:flex;justify-content:space-between;font-weight:700;margin-top:10px;font-size:1rem;"><span>Total</span><span style="color:var(--green-deep)">R$ ${fmt(total)}</span></div>`;
}

function finalizarPresencial() {
    if (!window._presItens || window._presItens.length === 0) { toast('⚠️ Adicione itens!'); return; }
    const nome = document.getElementById('pres-nome').value.trim() || 'Balcão';
    const quadra = document.getElementById('pres-quadra').value.trim();
    const lote = document.getElementById('pres-lote').value.trim();
    const pag = document.getElementById('pres-pag').value;

    let total = window._presItens.reduce((acc, i) => acc + i.preco * i.qtd, 0);

    mudarAba('entregas');
}

function salvarHistorico(pedido) {
    const hist = JSON.parse(localStorage.getItem('banca_historico') || '[]');
    hist.unshift({ ...pedido, data: pedido.data || new Date().toLocaleString('pt-BR') });
    
    // Manter apenas 30 dias pra não pesar
    const limite = new Date();
    limite.setDate(limite.getDate() - 30);
    const filtrado = hist.filter(h => {
        try {
            const partes = h.data.split(', ');
            const [d, m, a] = partes[0].split('/');
            return new Date(`${a}-${m}-${d}`) >= limite;
        } catch { return true; }
    });
    
    const arrayFinal = filtrado.slice(0, 200);
    localStorage.setItem('banca_historico', JSON.stringify(arrayFinal));
    
    // Manda uma cópia de segurança para o Google
    if (window.db) window.setDoc(window.doc(window.db, "loja", "historico"), { dados: arrayFinal }).catch(e=>console.log(e));
}

function renderAbaRelatorios(body) {
    document.getElementById('admin-titulo').textContent = '📊 Relatórios';
    const hist = JSON.parse(localStorage.getItem('banca_historico') || '[]');

    if (hist.length === 0) {
        body.innerHTML = '<p style="text-align:center;color:#999;padding:40px">Ainda não há pedidos registrados.</p>';
        return;
    }

    const contagem = {};
    const receita = {};
    hist.forEach(h => {
        h.itens.forEach(item => {
            contagem[item.nome] = (contagem[item.nome] || 0) + item.qtd;
            receita[item.nome] = (receita[item.nome] || 0) + (item.preco * item.qtd);
        });
    });

    const top = Object.entries(contagem).sort((a,b) => b[1]-a[1]).slice(0, 8);
    const maxQtd = top[0]?.[1] || 1;

    const totalReceita = hist.reduce((a, h) => a + (h.total || 0), 0);
    const totalPedidos = hist.length;
    const ticketMedio = totalPedidos > 0 ? totalReceita / totalPedidos : 0;
    const online = hist.filter(h => h.tipo !== 'presencial').length;
    const presencial = hist.filter(h => h.tipo === 'presencial').length;

    const clientes = {};
    hist.forEach(h => { clientes[h.nome] = (clientes[h.nome] || 0) + (h.total || 0); });
    const topClientes = Object.entries(clientes).sort((a,b)=>b[1]-a[1]).slice(0,5);

    body.innerHTML = `
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-box-val">${totalPedidos}</div>
                <div class="stat-box-label">Pedidos (30d)</div>
            </div>
            <div class="stat-box">
                <div class="stat-box-val">R$${fmt(ticketMedio)}</div>
                <div class="stat-box-label">Ticket médio</div>
            </div>
            <div class="stat-box">
                <div class="stat-box-val">R$${fmt(totalReceita)}</div>
                <div class="stat-box-label">Receita total</div>
            </div>
            <div class="stat-box">
                <div class="stat-box-val">${online}/${presencial}</div>
                <div class="stat-box-label">Online/Presencial</div>
            </div>
        </div>

        <div class="relatorio-card">
            <div class="relatorio-titulo">🏆 Produtos mais vendidos</div>
            ${top.map(([nome, qtd]) => `
                <div>
                    <div class="stat-row">
                        <span class="stat-nome">${nome}</span>
                        <span class="stat-val">${String(qtd).replace('.',',')} un.</span>
                    </div>
                    <div class="stat-bar"><div class="stat-fill" style="width:${Math.round(qtd/maxQtd*100)}%"></div></div>
                </div>
            `).join('')}
        </div>
    `;
}

    if (senha === null) return;
    const hash = await sha256(senha);
    const hashSalvo = localStorage.getItem('banca_senha_hash') || SENHA_HASH;
    if (hash !== hashSalvo) { toast('❌ Senha incorreta!'); return; }

function carregarFoto(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_SIZE = 400;
            let width = img.width, height = img.height;
            if (width > height && width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
            else if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            fotoBase64 = canvas.toDataURL('image/jpeg', 0.3);
            document.getElementById('foto-preview').src = fotoBase64;
            document.getElementById('foto-preview').style.display = 'block';
            document.getElementById('upload-text').style.display = 'none';
            document.getElementById('edit-link-foto').value = '';
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

async function salvarProduto() {
    const nome = document.getElementById('edit-nome').value.trim();
    const preco = parseFloat(document.getElementById('edit-preco').value);
    const estoque = parseFloat(document.getElementById('edit-status').value); 
    const cat = document.getElementById('edit-cat').value;
    const unidade = document.getElementById('edit-unidade').value;
    const emoji = document.getElementById('edit-emoji').value.trim() || '📦';
    const linkFoto = document.getElementById('edit-link-foto').value.trim();

    if (!nome || isNaN(preco) || preco <= 0) { 
        toast('⚠️ Preencha tudo corretamente!'); 
        return; 
    }

    const fotoFinal = fotoBase64 || (linkFoto ? linkFoto : null);
    const dadosProduto = { nome, preco, estoque, cat, unidade, emoji, foto: fotoFinal };

    toast("⏳ Salvando na nuvem...");

    try {
        let idParaUsar = editandoId ? String(editandoId) : String(Date.now());
        
        await window.setDoc(window.doc(window.db, "produtos", idParaUsar), dadosProduto);
        
        toast("✅ Salvo com sucesso!");
        carregarProdutosDoFirebase(); 
        mudarAba('produtos'); 
    } catch (e) {
        console.error(e);
        toast("❌ Erro ao salvar online");
    }
}

function deletarProduto(id) {
    if (!confirm('Excluir este produto?')) return;
    produtos = produtos.filter(p => p.id !== id);
    carrinho = carrinho.filter(c => c.id !== id);
    localStorage.setItem('banca_produtos', JSON.stringify(produtos));
    atualizarEstadoCarrinho();
    renderLoja();
    mudarAba('produtos');
    toast('🗑 Excluído');
}

function renderAbaConfig(body) {
    document.getElementById('admin-titulo').textContent = '⚙️ Configurações';
    body.innerHTML = `
        <div class="config-row"><div><strong>📱 WhatsApp</strong></div><input type="tel" id="cfg-numero" value="${localStorage.getItem('banca_whatsapp') || ''}" class="config-input-inline"></div>
        <button class="btn-primary" onclick="salvarConfig()" style="margin-top:20px;width:100%">💾 Salvar Configurações</button>
    `;
}

async function salvarConfig() {
    const num = document.getElementById('cfg-numero').value.replace(/\D/g,'');
    localStorage.setItem('banca_whatsapp', num);
    
    // Salva o número na nuvem para não perder
    if (window.db) {
        window.setDoc(window.doc(window.db, "loja", "config"), { whatsapp: num }).catch(e=>console.log(e));
    }
    
    toast('✅ Configurações salvas!');
}

function fmt(n) { return parseFloat(n).toFixed(2).replace('.', ','); }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('visivel'); clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('visivel'), 2800); }
function abrirModal(id) { document.getElementById(id).classList.add('aberto'); }
function fecharModal(id) { document.getElementById(id).classList.remove('aberto'); }
document.querySelectorAll('.modal-overlay').forEach(ov => { ov.addEventListener('click', e => { if (e.target === ov) fecharModal(ov.id); }); });
async function sha256(msg) { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg)); return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join(''); }
